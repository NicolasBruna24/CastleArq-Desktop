[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "castlearq-desktop"
version = "0.1.0"
description = "CastleArq Desktop - minimal PySide6 application shell (Phase 1)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[project.scripts]
castlearq-desktop = "castlearq_desktop.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
